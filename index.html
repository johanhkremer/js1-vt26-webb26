<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <Link rel="stylesheet" href="style/index.css">


    <title>Javascript 1 - Väderapp</title>
</head>

<body class="container min-vh-100 d-flex flex-column">
    <header>
        <h1>Väderapp</h1>
    </header>

    <main class="flex-grow-1">
        <form id="weatherCityForm">
            <label for="weatherCityInput">Skriv in en stad</label>
            <br>
            <input type="text" id="weatherCityInput">
            <button type="submit">Hämta väder</button>
        </form>

        <h2>Aktuellt Väder</h2>
        <section id="currentWeatherCard">

            <!-- Aktuell väderdata -->

        </section>

        <h2>Prognos</h2>
        <section id="forcastContainer">

            <!-- Prognos väderdata -->

        </section>
    </main>

    <footer>
        <p>2026</p>
    </footer>

    <!--
        type="module" gör att webbläsaren behandlar script/index.js som en JavaScript-modul.
        Då kan filen använda import/export och hämta kod från andra JavaScript-filer.
    -->
    <script type="module" src="script/index.js"></script>
</body>

</html>
